<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstroPlay OS</title>
    <script>
      // Apply theme before first paint to avoid flash
      try {
        var stored = localStorage.getItem('astroplay-theme');
        var theme = stored ? JSON.parse(stored).state?.theme : 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.background = '#0f172a';
          document.body && (document.body.style.background = '#0f172a');
        } else {
          document.documentElement.style.background = '#f8fafc';
          document.body && (document.body.style.background = '#f8fafc');
        }
      } catch(e) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.background = '#0f172a';
      }
    </script>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      /* Dark loading (default) */
      html.dark body { background: #0f172a; }
      html.dark .app-loading-screen { background: #0f172a; color: #94a3b8; }
      html.dark .spinner { border-color: rgba(255,255,255,0.1); border-left-color: #3b82f6; }
      /* Light loading */
      html:not(.dark) body { background: #f8fafc; }
      html:not(.dark) .app-loading-screen { background: #f8fafc; color: #64748b; }
      html:not(.dark) .spinner { border-color: rgba(0,0,0,0.1); border-left-color: #3b82f6; }

      .app-loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
      }
      .loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border-width: 3px;
        border-style: solid;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 18px;
      }
      @keyframes spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loading-text {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="app-loading-screen">
        <div class="loading-inner">
          <div class="spinner"></div>
          <div class="loading-text">Cargando AstroPlay...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
